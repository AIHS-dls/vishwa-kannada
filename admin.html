<!DOCTYPE html>
<html lang="kn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ವಿಶ್ವ ಕನ್ನಡ | Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f6fb;
  color:#18243a;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Kannada",
    sans-serif;
}

.header{
  background:#0b3d91;
  color:white;
  padding:25px 0;
}

.container{
  width:min(650px,92%);
  margin:auto;
}

.header h1{
  margin:0;
  font-size:27px;
}

.header p{
  margin:6px 0 0;
  opacity:.85;
}

.card{
  background:white;
  margin:25px auto;
  padding:22px;
  border-radius:16px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:7px;
  font-weight:700;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #d5dce8;
  border-radius:10px;
  font-size:16px;
  font-family:inherit;
}

textarea{
  min-height:180px;
}

#preview{
  display:none;
  width:100%;
  height:auto;
  max-height:400px;
  object-fit:contain;
  margin-top:18px;
  border-radius:12px;
  border:2px solid #ddd;
}

#message{
  display:none;
  margin-top:12px;
  padding:12px;
  background:#e8f7ed;
  color:#176b36;
  border-radius:10px;
  font-weight:bold;
}

</style>

</head>

<body>

<header class="header">

<div class="container">

<h1>ವಿಶ್ವ ಕನ್ನಡ</h1>

<p>Admin Panel • ಲೇಖನ ಸಿದ್ಧಪಡಿಸಿ</p>

</div>

</header>


<main class="container">

<div class="card">


<label>
ಲೇಖನದ ಶೀರ್ಷಿಕೆ
</label>

<input
id="title"
type="text"
placeholder="ಲೇಖನದ ಶೀರ್ಷಿಕೆ"
>


<label>
ವಿಷಯ
</label>

<select id="category">

<option value="News">
ಸುದ್ದಿ
</option>

<option value="Indian History">
ಭಾರತೀಯ ಇತಿಹಾಸ
</option>

<option value="Karnataka History">
ಕರ್ನಾಟಕ ಇತಿಹಾಸ
</option>

<option value="Science & Technology">
ವಿಜ್ಞಾನ ಮತ್ತು ತಂತ್ರಜ್ಞಾನ
</option>

<option value="Cinema">
ಸಿನಿಮಾ
</option>

<option value="Sports">
ಕ್ರೀಡೆ
</option>

<option value="Mystery">
ರಹಸ್ಯ
</option>

</select>


<label>
ಲೇಖನ
</label>

<textarea
id="description"
placeholder="ನಿಮ್ಮ ಲೇಖನವನ್ನು ಇಲ್ಲಿ ಬರೆಯಿರಿ..."
></textarea>


<label>
ಚಿತ್ರ ಆಯ್ಕೆ ಮಾಡಿ
</label>

<input
id="imageFile"
type="file"
accept="image/*"
>


<div id="message">
✅ ಚಿತ್ರ ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ
</div>


<img
id="preview"
alt="ಆಯ್ಕೆ ಮಾಡಿದ ಚಿತ್ರದ Preview"
>


</div>

</main>


<script>

const imageFile =
document.getElementById("imageFile");

const preview =
document.getElementById("preview");

const message =
document.getElementById("message");


imageFile.onchange =
function(){

  const file =
    imageFile.files[0];

  console.log("Selected file:", file);


  if(!file){

    preview.style.display =
      "none";

    message.style.display =
      "none";

    return;

  }


  if(!file.type.startsWith("image/")){

    alert(
      "ದಯವಿಟ್ಟು image file ಆಯ್ಕೆ ಮಾಡಿ."
    );

    imageFile.value = "";

    return;

  }


  /*
    Browser temporary URL
    */

  const imageURL =
    URL.createObjectURL(file);


  preview.src =
    imageURL;


  preview.style.display =
    "block";


  message.style.display =
    "block";


  /*
    Image load ಆಗಿದೆಯೇ check
    */

  preview.onload =
  function(){

    console.log(
      "Preview loaded successfully"
    );

  };


  preview.onerror =
  function(){

    console.log(
      "Preview loading failed"
    );

  };

};

</script>

</body>

</html>
