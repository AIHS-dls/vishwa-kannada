<!DOCTYPE html>
<html lang="kn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ವಿಶ್ವ ಕನ್ನಡ | Admin Panel</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f6fb;
  color:#172033;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Kannada",
    sans-serif;
}

.header{
  background:#0b3d91;
  color:white;
  padding:24px 0;
}

.container{
  width:min(680px,92%);
  margin:auto;
}

.header h1{
  margin:0;
  font-size:28px;
}

.header p{
  margin:6px 0 0;
  opacity:.85;
}

.card{
  background:white;
  margin:25px auto;
  padding:22px;
  border-radius:16px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:7px;
  font-weight:700;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #d5dce8;
  border-radius:10px;
  font-size:16px;
  font-family:inherit;
}

textarea{
  min-height:190px;
  resize:vertical;
}

#preview{
  display:none;
  width:100%;
  max-height:400px;
  object-fit:contain;
  margin-top:15px;
  border-radius:12px;
  border:2px solid #ddd;
}

#imageMessage{
  display:none;
  margin-top:10px;
  padding:10px;
  background:#e8f7ed;
  color:#176b36;
  border-radius:8px;
  font-weight:600;
}

button{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#0b3d91;
  color:white;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

#status{
  display:none;
  margin-top:15px;
  padding:14px;
  border-radius:10px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
}

.success{
  display:block !important;
  background:#e8f7ed;
  color:#176b36;
}

.error{
  display:block !important;
  background:#fdeaea;
  color:#a21d1d;
}

.response{
  display:block !important;
  background:#eef3fa;
  color:#172033;
  font-family:monospace;
  font-size:13px;
}

</style>

</head>


<body>


<header class="header">

<div class="container">

<h1>ವಿಶ್ವ ಕನ್ನಡ</h1>

<p>Admin Panel • ಹೊಸ ಲೇಖನ ಪ್ರಕಟಿಸಿ</p>

</div>

</header>


<main class="container">

<div class="card">


<label>
ಲೇಖನದ ಶೀರ್ಷಿಕೆ
</label>

<input
id="title"
type="text"
placeholder="ಉದಾ: ಕರ್ನಾಟಕದ ಇತಿಹಾಸದ ಒಂದು ಕುತೂಹಲಕಾರಿ ಅಧ್ಯಾಯ"
>


<label>
ವಿಷಯ
</label>

<select id="category">

<option value="News">
ಸುದ್ದಿ
</option>

<option value="Indian History">
ಭಾರತೀಯ ಇತಿಹಾಸ
</option>

<option value="Karnataka History">
ಕರ್ನಾಟಕ ಇತಿಹಾಸ
</option>

<option value="Science & Technology">
ವಿಜ್ಞಾನ ಮತ್ತು ತಂತ್ರಜ್ಞಾನ
</option>

<option value="Cinema">
ಸಿನಿಮಾ
</option>

<option value="Sports">
ಕ್ರೀಡೆ
</option>

<option value="Mystery">
ರಹಸ್ಯ
</option>

</select>


<label>
ಲೇಖನ
</label>

<textarea
id="description"
placeholder="ನಿಮ್ಮ ಲೇಖನವನ್ನು ಇಲ್ಲಿ ಬರೆಯಿರಿ..."
></textarea>


<label>
ಚಿತ್ರ ಆಯ್ಕೆ ಮಾಡಿ
</label>

<input
id="imageFile"
type="file"
accept="image/*"
>


<div id="imageMessage">
✅ ಚಿತ್ರ ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ
</div>


<img
id="preview"
alt="ಚಿತ್ರ Preview"
>


<button
id="publishButton"
type="button"
onclick="publishArticle()"
>

🚀 ಲೇಖನ ಪ್ರಕಟಿಸಿ

</button>


<div id="status"></div>


</div>
  <div class="card">

<h2>Published Articles</h2>

<div id="articles">
Loading articles...
</div>

</div>

</main>


<script>

/* =========================
   GOOGLE APPS SCRIPT URL
========================= */

const API_URL = 
"https://script.google.com/macros/s/AKfycbwaeZ4DuJM3gDCikPG36kFSNQav74q-6tPqFBUqM0YKbasUi7eskjOUiotjpBxlO4GvuQ/exec";

/* =========================
   ELEMENTS
========================= */

const imageFile =
document.getElementById("imageFile");

const preview =
document.getElementById("preview");

const imageMessage =
document.getElementById("imageMessage");

const statusBox =
document.getElementById("status");

const publishButton =
document.getElementById("publishButton");


/* =========================
   IMAGE PREVIEW
========================= */

imageFile.addEventListener(
"change",
function(){

  const file =
    imageFile.files[0];

  if(!file){

    preview.style.display =
      "none";

    imageMessage.style.display =
      "none";

    return;

  }


  if(
    !file.type.startsWith("image/")
  ){

    alert(
      "ದಯವಿಟ್ಟು JPG ಅಥವಾ PNG image ಆಯ್ಕೆ ಮಾಡಿ."
    );

    imageFile.value = "";

    return;

  }


  const imageURL =
    URL.createObjectURL(file);


  preview.src =
    imageURL;


  preview.style.display =
    "block";


  imageMessage.style.display =
    "block";

});


/* =========================
   COMPRESS IMAGE
========================= */

function compressImage(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(event){

          const img =
            new Image();


          img.onload =
            function(){

              let width =
                img.width;

              let height =
                img.height;


              const maxWidth =
                1200;


              if(
                width > maxWidth
              ){

                height =
                  height *
                  maxWidth /
                  width;

                width =
                  maxWidth;

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              const imageData =
                canvas.toDataURL(
                  "image/jpeg",
                  0.72
                );


              resolve(
                imageData
              );

            };


          img.onerror =
            function(){

              reject(
                new Error(
                  "Image load failed"
                )
              );

            };


          img.src =
            event.target.result;

        };


      reader.onerror =
        function(){

          reject(
            new Error(
              "File read failed"
            )
          );

        };


      reader.readAsDataURL(file);

    }
  );

}


/* =========================
   PUBLISH
========================= */

async function publishArticle(){

  const title =
    document
      .getElementById("title")
      .value
      .trim();


  const category =
    document
      .getElementById("category")
      .value;


  const description =
    document
      .getElementById("description")
      .value
      .trim();


  const file =
    imageFile.files[0];


  /* VALIDATION */

  if(!title){

    showStatus(
      "❌ ಲೇಖನದ ಶೀರ್ಷಿಕೆ ಹಾಕಿ.",
      "error"
    );

    return;

  }


  if(!description){

    showStatus(
      "❌ ಲೇಖನ ಬರೆಯಿರಿ.",
      "error"
    );

    return;

  }


  publishButton.disabled =
    true;


  publishButton.textContent =
    "⏳ ಪ್ರಕಟಿಸಲಾಗುತ್ತಿದೆ...";


  try{

    let imageData = "";

    let imageName = "";


    /* IMAGE */

    if(file){

      showStatus(
        "🖼️ ಚಿತ್ರ ಸಿದ್ಧಪಡಿಸಲಾಗುತ್ತಿದೆ...",
        "success"
      );


      imageData =
        await compressImage(
          file
        );


      imageName =
        file.name
          .replace(
            /\.[^/.]+$/,
            ""
          ) +
        ".jpg";

    }


    /* FORM DATA */

    const formData =
      new URLSearchParams();


    formData.append(
      "title",
      title
    );


    formData.append(
      "category",
      category
    );


    formData.append(
      "description",
      description
    );


    formData.append(
      "imageData",
      imageData
    );


    formData.append(
      "imageName",
      imageName
    );


    formData.append(
      "date",
      new Date()
        .toLocaleDateString(
          "en-GB"
        )
    );


    showStatus(
      "☁️ Google Drive ಮತ್ತು Google Sheetಗೆ ಕಳುಹಿಸಲಾಗುತ್ತಿದೆ...",
      "success"
    );


    /* =========================
       SEND TO APPS SCRIPT
    ========================= */

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/x-www-form-urlencoded;charset=UTF-8"
          },

          body:
            formData.toString()
        }
      );


    const result =
      await response.text();


    console.log(
      "Apps Script Response:",
      result
    );


    /* =========================
       SHOW EXACT RESPONSE
    ========================= */

    showStatus(
      "Apps Script Response:\n\n" +
      result,
      "response"
    );


    /* =========================
       SUCCESS CHECK
    ========================= */

    if(
      result.indexOf(
        '"success":true'
      ) !== -1
    ){

      showStatus(
        "✅ ಲೇಖನ ಯಶಸ್ವಿಯಾಗಿ ಪ್ರಕಟಿಸಲಾಗಿದೆ!\n\n" +
        result,
        "success"
      );


      document
        .getElementById("title")
        .value = "";


      document
        .getElementById("description")
        .value = "";


      imageFile.value =
        "";


      preview.src =
        "";


      preview.style.display =
        "none";


      imageMessage.style.display =
        "none";

    }


  }catch(error){

    console.error(
      error
    );


    showStatus(
      "❌ Error:\n\n" +
      error.message,
      "error"
    );

  }


  publishButton.disabled =
    false;


  publishButton.textContent =
    "🚀 ಲೇಖನ ಪ್ರಕಟಿಸಿ";

}


/* =========================
   STATUS
========================= */

function showStatus(
  message,
  type
){

  statusBox.textContent =
    message;

  statusBox.className =
    type;

}

</script>


</body>

</html>
