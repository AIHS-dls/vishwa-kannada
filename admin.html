<!DOCTYPE html>
<html lang="kn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ವಿಶ್ವ ಕನ್ನಡ | Admin</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Kannada",
    sans-serif;

  background: #f3f6fb;
  color: #18243a;
}

.container {
  width: min(650px, 92%);
  margin: auto;
}

.header {
  background: #0b3d91;
  color: white;
  padding: 25px 0;
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 6px 0 0;
  opacity: .85;
  font-size: 13px;
}

.card {
  background: white;
  margin: 25px auto;
  padding: 22px;
  border-radius: 16px;
  box-shadow:
    0 8px 30px rgba(20,40,80,.08);
}

label {
  display: block;
  font-weight: 700;
  margin: 16px 0 7px;
}

input,
select,
textarea {

  width: 100%;

  padding: 13px;

  border: 1px solid #d9e0eb;

  border-radius: 10px;

  font-size: 15px;

  outline: none;

  font-family: inherit;

}

textarea {
  min-height: 180px;
  resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #0b3d91;
}

.preview {
  width: 100%;
  max-height: 260px;
  object-fit: cover;
  border-radius: 12px;
  margin-top: 12px;
  display: none;
}

.publish {

  width: 100%;

  margin-top: 22px;

  padding: 15px;

  border: 0;

  border-radius: 11px;

  background: #0b3d91;

  color: white;

  font-size: 16px;

  font-weight: 800;

  cursor: pointer;

}

.publish:disabled {
  opacity: .6;
}

.status {

  margin-top: 15px;

  padding: 13px;

  border-radius: 10px;

  display: none;

  text-align: center;

}

.success {
  display: block;
  background: #e7f7ed;
  color: #176b36;
}

.error {
  display: block;
  background: #fdeaea;
  color: #9b2222;
}

.note {

  font-size: 12px;

  color: #69778d;

  line-height: 1.6;

  margin-top: 15px;

}

</style>

</head>


<body>


<header class="header">

<div class="container">

<h1>ವಿಶ್ವ ಕನ್ನಡ</h1>

<p>Admin Panel • ಹೊಸ ಲೇಖನ ಪ್ರಕಟಿಸಿ</p>

</div>

</header>


<main class="container">

<div class="card">


<label>
ಲೇಖನದ ಶೀರ್ಷಿಕೆ
</label>

<input
id="title"
type="text"
placeholder="ಉದಾ: ಕರ್ನಾಟಕದ ಇತಿಹಾಸದ ಕುತೂಹಲಕಾರಿ ಅಧ್ಯಾಯ">


<label>
ವಿಷಯ
</label>

<select id="category">

<option value="News">
ಸುದ್ದಿ
</option>

<option value="Indian History">
ಭಾರತೀಯ ಇತಿಹಾಸ
</option>

<option value="Karnataka History">
ಕರ್ನಾಟಕ ಇತಿಹಾಸ
</option>

<option value="Science & Technology">
ವಿಜ್ಞಾನ ಮತ್ತು ತಂತ್ರಜ್ಞಾನ
</option>

<option value="Cinema">
ಸಿನಿಮಾ
</option>

<option value="Sports">
ಕ್ರೀಡೆ
</option>

<option value="Mystery">
ರಹಸ್ಯ
</option>

</select>


<label>
ಲೇಖನ
</label>

<textarea
id="description"
placeholder="ನಿಮ್ಮ ಲೇಖನವನ್ನು ಇಲ್ಲಿ ಬರೆಯಿರಿ...">
</textarea>


<label>
ಚಿತ್ರ
</label>

<input
id="image"
type="file"
accept="image/*">

<img
id="preview"
class="preview">


<button
id="publish"
class="publish"
onclick="publishArticle()">

🚀 ಲೇಖನ ಪ್ರಕಟಿಸಿ

</button>


<div
id="status"
class="status">
</div>


<div class="note">

ಚಿತ್ರವನ್ನು ಆಯ್ಕೆ ಮಾಡಿದ ನಂತರ ಅದು Google Driveನಲ್ಲಿ
ಸಂಗ್ರಹವಾಗುತ್ತದೆ ಮತ್ತು ಲೇಖನದೊಂದಿಗೆ websiteನಲ್ಲಿ
ಸ್ವಯಂಚಾಲಿತವಾಗಿ ಕಾಣಿಸುತ್ತದೆ.

</div>


</div>

</main>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwaeZ4DuJM3gDCikPG36kFSNQav74q-6tPqFBUqM0YKbasUi7eskjOUiotjpBxlO4GvuQ/exec";


const imageInput =
document.getElementById("image");

const preview =
document.getElementById("preview");


imageInput.addEventListener(
"change",
function() {

  const file =
    this.files[0];

  if (!file) return;

  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";

});


function compressImage(file) {

  return new Promise(
    (resolve, reject) => {

      const img =
        new Image();

      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          img.src =
            e.target.result;

        };


      img.onload =
        function() {

          const maxWidth = 1200;

          let width =
            img.width;

          let height =
            img.height;


          if (width > maxWidth) {

            height =
              height *
              maxWidth /
              width;

            width =
              maxWidth;

          }


          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d"
            );


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          const data =
            canvas.toDataURL(
              "image/jpeg",
              0.78
            );


          resolve(data);

        };


      img.onerror =
        reject;


      reader.readAsDataURL(file);

    }
  );

}


async function publishArticle() {

  const title =
    document.getElementById(
      "title"
    ).value.trim();


  const category =
    document.getElementById(
      "category"
    ).value;


  const description =
    document.getElementById(
      "description"
    ).value.trim();


  const file =
    imageInput.files[0];


  const status =
    document.getElementById(
      "status"
    );


  const button =
    document.getElementById(
      "publish"
    );


  if (!title) {

    showStatus(
      "ಲೇಖನದ ಶೀರ್ಷಿಕೆ ನಮೂದಿಸಿ.",
      "error"
    );

    return;

  }


  if (!description) {

    showStatus(
      "ಲೇಖನದ ವಿಷಯ ನಮೂದಿಸಿ.",
      "error"
    );

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "ಪ್ರಕಟಿಸಲಾಗುತ್ತಿದೆ...";


  try {

    let imageData = "";


    if (file) {

      imageData =
        await compressImage(file);

    }


    const payload = {

      title:
        title,

      category:
        category,

      description:
        description,

      imageData:
        imageData,

      imageName:
        file
          ? file.name
          : "article.jpg",

      imageType:
        "image/jpeg",

      date:
        new Date()
          .toLocaleDateString(
            "en-GB"
          )

    };


    await fetch(
      API_URL,
      {

        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


    showStatus(
      "✅ ಲೇಖನ ಪ್ರಕಟಿಸಲು ಕಳುಹಿಸಲಾಗಿದೆ. ಸ್ವಲ್ಪ ಸಮಯದ ನಂತರ website refresh ಮಾಡಿ.",
      "success"
    );


    document.getElementById(
      "title"
    ).value = "";


    document.getElementById(
      "description"
    ).value = "";


    imageInput.value = "";

    preview.style.display =
      "none";


  } catch (error) {

    console.error(error);

    showStatus(
      "❌ ಪ್ರಕಟಿಸುವಾಗ ಸಮಸ್ಯೆ ಉಂಟಾಗಿದೆ.",
      "error"
    );

  }


  button.disabled =
    false;

  button.textContent =
    "🚀 ಲೇಖನ ಪ್ರಕಟಿಸಿ";

}


function showStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );

  status.textContent =
    message;

  status.className =
    "status " + type;

}

</script>

</body>

</html>
