<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ವಿಶ್ವ ಕನ್ನಡ - Admin</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#f4f6fa;
  font-family:Arial,sans-serif;
}

.box{
  max-width:600px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:15px;
}

h1{
  color:#0b3d91;
}

label{
  display:block;
  font-weight:bold;
  margin-top:20px;
  margin-bottom:8px;
}

input,select,textarea{
  width:100%;
  padding:12px;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

textarea{
  height:180px;
}

#preview{
  display:none;
  width:100%;
  max-height:300px;
  object-fit:cover;
  margin-top:15px;
  border-radius:10px;
}

button{
  width:100%;
  margin-top:20px;
  padding:15px;
  background:#0b3d91;
  color:white;
  border:0;
  border-radius:8px;
  font-size:17px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h1>ವಿಶ್ವ ಕನ್ನಡ</h1>

<p>ಹೊಸ ಲೇಖನ ಪ್ರಕಟಿಸಿ</p>

<label>ಲೇಖನದ ಶೀರ್ಷಿಕೆ</label>

<input
id="title"
type="text"
placeholder="ಶೀರ್ಷಿಕೆ ಬರೆಯಿರಿ"
>


<label>ವಿಷಯ</label>

<select id="category">

<option>News</option>
<option>Indian History</option>
<option>Karnataka History</option>
<option>Science & Technology</option>
<option>Cinema</option>
<option>Sports</option>
<option>Mystery</option>

</select>


<label>ಲೇಖನ</label>

<textarea
id="description"
placeholder="ಲೇಖನ ಬರೆಯಿರಿ..."
></textarea>


<label>ಚಿತ್ರ ಆಯ್ಕೆ ಮಾಡಿ</label>

<input
id="imageFile"
type="file"
accept="image/*"
>


<img
id="preview"
alt="ಚಿತ್ರ Preview"
>


<button>
🚀 ಲೇಖನ ಪ್ರಕಟಿಸಿ
</button>

</div>


<script>

const imageFile =
document.getElementById("imageFile");

const preview =
document.getElementById("preview");


imageFile.addEventListener(
"change",
function(event){

  const file =
    event.target.files[0];

  if(!file){

    preview.style.display =
      "none";

    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(e){

      preview.src =
        e.target.result;

      preview.style.display =
        "block";

    };


  reader.readAsDataURL(file);

});

</script>

</body>
</html>
