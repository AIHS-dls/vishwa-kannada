<!DOCTYPE html>
<html lang="kn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ವಿಶ್ವ ಕನ್ನಡ | ಲೇಖನ</title>

<meta name="description" content="ವಿಶ್ವ ಕನ್ನಡ ಲೇಖನ">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#f5f7fb;
font-family:
system-ui,
"Noto Sans Kannada",
sans-serif;
color:#172033;
}


header{

background:#0b3d91;
color:white;
padding:18px 0;

}


.container{

width:min(900px,92%);
margin:auto;

}


.header-inner{

display:flex;
justify-content:space-between;
align-items:center;

}


.logo{

font-size:24px;
font-weight:bold;

}


.home-btn{

background:white;
color:#0b3d91;
padding:8px 15px;
border-radius:20px;
text-decoration:none;
font-weight:bold;

}



.article-box{

background:white;
margin:30px 0;
padding:25px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.08);

}


.article-image{

width:100%;
max-height:520px;
object-fit:cover;
border-radius:18px;
margin-bottom:20px;

}


.category{

display:inline-block;
background:#e8f0ff;
color:#0b3d91;
padding:6px 15px;
border-radius:20px;
font-weight:bold;
margin-bottom:15px;

}


h1{

font-size:36px;
line-height:1.4;
margin:10px 0;

}


.date{

color:#777;
margin-bottom:20px;

}


.description{

font-size:19px;
line-height:1.9;
white-space:pre-line;

}



.share{

display:flex;
gap:12px;
margin-top:30px;

}


.share button{

border:none;
padding:12px 18px;
border-radius:25px;
cursor:pointer;
font-size:15px;

}


.whatsapp{

background:#25D366;
color:white;

}


.copy{

background:#0b3d91;
color:white;

}



@media(max-width:600px){

h1{

font-size:26px;

}

.description{

font-size:17px;

}

}
.related-grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;

}


.related-card{

background:#f8f9fc;
padding:15px;
border-radius:15px;
cursor:pointer;

}


.related-card img{

width:100%;
height:150px;
object-fit:cover;
border-radius:12px;

}


.related-card h3{

font-size:18px;

}


.related-card span{

color:#0b3d91;
font-size:14px;

}

</style>


</head>


<body>


<header>

<div class="container header-inner">


<div class="logo">

ವಿ ವಿಶ್ವ ಕನ್ನಡ

</div>


<a class="home-btn" href="index.html">

← ಮುಖಪುಟ

</a>


</div>

</header>



<div class="container">


<div class="article-box">


<img 
id="image"
class="article-image"
style="display:none;">



<span 
id="category"
class="category">

</span>



<h1 id="title">

Loading...

</h1>



<div 
id="date"
class="date">

</div>



<div 
id="description"
class="description">

</div>



<div class="share">


<button 
class="whatsapp"
onclick="shareWhatsApp()">

WhatsApp Share

</button>


<button
class="copy"
onclick="copyLink()">

Copy Link

</button>


</div>
  <div class="like-box">

<button 
class="like-btn"
onclick="likeArticle()">

❤️ Like 
<span id="likeCount">0</span>

</button>

</div>

  <div class="comment-box">

<h2>💬 ಅಭಿಪ್ರಾಯಗಳು</h2>

<input 
id="commentName"
type="text"
placeholder="ನಿಮ್ಮ ಹೆಸರು">


<textarea
id="commentText"
placeholder="ನಿಮ್ಮ ಅಭಿಪ್ರಾಯ ಬರೆಯಿರಿ"></textarea>


<button onclick="addComment()">
Comment Post ಮಾಡಿ
</button>


<div id="commentsList"></div>

</div>
<br><br>

<hr>

<h2>
ಇದೇ ರೀತಿಯ ಇತರ ಲೇಖನಗಳು
</h2>

<div id="related" class="related-grid"></div>

</div>


</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwaeZ4DuJM3gDCikPG36kFSNQav74q-6tPqFBUqM0YKbasUi7eskjOUiotjpBxlO4GvuQ/exec";

let currentArticle = {};


/* =========================
   LOAD ARTICLE
========================= */

async function loadArticle(){

  const id =
    new URLSearchParams(
      window.location.search
    ).get("id");

  try {

    const response =
      await fetch(API_URL);

    if(!response.ok){
      throw new Error("API Error");
    }

    const articles =
      await response.json();

    if(!Array.isArray(articles)){
      throw new Error("Invalid article data");
    }

    currentArticle =
      articles[Number(id)];

    if(!currentArticle){

      document.getElementById("title").innerText =
        "ಲೇಖನ ಸಿಗಲಿಲ್ಲ";

      return;

    }

    document.getElementById("title").innerText =
      currentArticle.title || "";

    document.getElementById("category").innerText =
      currentArticle.category || "";

    document.getElementById("date").innerText =
      "📅 " + (currentArticle.date || "");

    document.getElementById("description").innerText =
      currentArticle.description || "";


    if(currentArticle.image){

      const img =
        document.getElementById("image");

      img.src =
        currentArticle.image;

      img.style.display =
        "block";

    }


    showRelatedArticles(
      articles,
      Number(id)
    );


    loadComments();

    loadLikeCount();


  } catch(error){

    console.error(
      "Article loading error:",
      error
    );

    document.getElementById("title").innerText =
      "ಲೇಖನ ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ";

  }

}


/* =========================
   WHATSAPP SHARE
========================= */

function shareWhatsApp(){

  const url =
    window.location.href;

  const text =
    currentArticle.title +
    "\n\n" +
    url;

  window.open(
    "https://wa.me/?text=" +
    encodeURIComponent(text)
  );

}


/* =========================
   COPY LINK
========================= */

function copyLink(){

  navigator.clipboard.writeText(
    window.location.href
  );

  alert(
    "ಲೇಖನ ಲಿಂಕ್ copy ಆಗಿದೆ!"
  );

}


/* =========================
   RELATED ARTICLES
========================= */

function showRelatedArticles(
  articles,
  currentId
){

  const box =
    document.getElementById(
      "related"
    );

  if(!box) return;


  const related =
    articles
      .filter((item,index)=>{

        return (
          index != currentId &&
          item.category ===
          currentArticle.category
        );

      })
      .slice(0,3);


  box.innerHTML = "";


  related.forEach(item=>{

    const index =
      articles.indexOf(item);


    box.innerHTML += `

      <div
        class="related-card"
        onclick="
          location.href=
          'article.html?id=${index}'
        "
      >

        <h3>
          ${item.title || ""}
        </h3>

        <span>
          ${item.category || ""}
        </span>

      </div>

    `;

  });

}


/* =========================
   LIKE ARTICLE
========================= */

async function likeArticle(){

  const id =
    new URLSearchParams(
      window.location.search
    ).get("id");


  const form =
    new URLSearchParams();


  form.append(
    "action",
    "like"
  );


  form.append(
    "id",
    id
  );


  try{

    const response =
      await fetch(API_URL,{
        method:"POST",
        body:form
      });


    const result =
      await response.json();


    if(result.success){

      document.getElementById(
        "likeCount"
      ).innerText =
        result.likes;

    }

  }catch(error){

    console.error(
      "Like error:",
      error
    );

  }

}


/* =========================
   LOAD LIKE COUNT
========================= */

async function loadLikeCount(){

  const id =
    new URLSearchParams(
      window.location.search
    ).get("id");


  try{

    const response =
      await fetch(
        API_URL +
        "?action=likes&id=" +
        id
      );


    const result =
      await response.json();


    document.getElementById(
      "likeCount"
    ).innerText =
      result.likes || 0;


  }catch(error){

    console.error(
      "Like count error:",
      error
    );

  }

}


/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(){

  const id =
    new URLSearchParams(
      window.location.search
    ).get("id");


  try{

    const response =
      await fetch(
        API_URL +
        "?action=comments&id=" +
        id
      );


    const comments =
      await response.json();


    const box =
      document.getElementById(
        "commentsList"
      );


    if(!box) return;


    box.innerHTML = "";


    if(!Array.isArray(comments)){
      return;
    }


    comments.forEach(item=>{

      box.innerHTML += `

        <div class="comment-item">

          <b>
            ${item.name || "Anonymous"}
          </b>

          <p>
            ${item.comment || ""}
          </p>

          <small>
            ${item.date || ""}
          </small>

        </div>

      `;

    });


  }catch(error){

    console.error(
      "Comments loading error:",
      error
    );

  }

}


/* =========================
   ADD COMMENT
========================= */

async function addComment(){

  const id =
    new URLSearchParams(
      window.location.search
    ).get("id");


  const name =
    document.getElementById(
      "commentName"
    ).value.trim();


  const comment =
    document.getElementById(
      "commentText"
    ).value.trim();


  if(!comment){

    alert(
      "ದಯವಿಟ್ಟು ನಿಮ್ಮ ಅಭಿಪ್ರಾಯವನ್ನು ಬರೆಯಿರಿ."
    );

    return;

  }


  const form =
    new URLSearchParams();


  form.append(
    "action",
    "comment"
  );


  form.append(
    "articleId",
    id
  );


  form.append(
    "name",
    name || "Anonymous"
  );


  form.append(
    "comment",
    comment
  );


  try{

    const response =
await fetch(API_URL,{
  method:"POST",
  body:form
});

const text =
await response.text();

console.log("POST RESPONSE:", text);

let result;

try {

  result = JSON.parse(text);

} catch(error) {

  console.error(
    "Server returned:",
    text
  );

  alert(
    "Apps Script JSON response ಕೊಡುತ್ತಿಲ್ಲ.\n\n" +
    text
  );

  return;

}


/* =========================
   START
========================= */

loadArticle();

</script>

</body>

</html>
