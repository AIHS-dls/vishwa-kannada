<!DOCTYPE html>
<html lang="kn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ವಿಶ್ವ ಕನ್ನಡ | ಲೇಖನ</title>

<meta name="description" content="ವಿಶ್ವ ಕನ್ನಡ ಲೇಖನ">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#f5f7fb;
font-family:
system-ui,
"Noto Sans Kannada",
sans-serif;
color:#172033;
}


header{

background:#0b3d91;
color:white;
padding:18px 0;

}


.container{

width:min(900px,92%);
margin:auto;

}


.header-inner{

display:flex;
justify-content:space-between;
align-items:center;

}


.logo{

font-size:24px;
font-weight:bold;

}


.home-btn{

background:white;
color:#0b3d91;
padding:8px 15px;
border-radius:20px;
text-decoration:none;
font-weight:bold;

}



.article-box{

background:white;
margin:30px 0;
padding:25px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.08);

}


.article-image{

width:100%;
max-height:520px;
object-fit:cover;
border-radius:18px;
margin-bottom:20px;

}


.category{

display:inline-block;
background:#e8f0ff;
color:#0b3d91;
padding:6px 15px;
border-radius:20px;
font-weight:bold;
margin-bottom:15px;

}


h1{

font-size:36px;
line-height:1.4;
margin:10px 0;

}


.date{

color:#777;
margin-bottom:20px;

}


.description{

font-size:19px;
line-height:1.9;
white-space:pre-line;

}



.share{

display:flex;
gap:12px;
margin-top:30px;

}


.share button{

border:none;
padding:12px 18px;
border-radius:25px;
cursor:pointer;
font-size:15px;

}


.whatsapp{

background:#25D366;
color:white;

}


.copy{

background:#0b3d91;
color:white;

}



@media(max-width:600px){

h1{

font-size:26px;

}

.description{

font-size:17px;

}

}
.related-grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;

}


.related-card{

background:#f8f9fc;
padding:15px;
border-radius:15px;
cursor:pointer;

}


.related-card img{

width:100%;
height:150px;
object-fit:cover;
border-radius:12px;

}


.related-card h3{

font-size:18px;

}


.related-card span{

color:#0b3d91;
font-size:14px;

}

</style>


</head>


<body>


<header>

<div class="container header-inner">


<div class="logo">

ವಿ ವಿಶ್ವ ಕನ್ನಡ

</div>


<a class="home-btn" href="index.html">

← ಮುಖಪುಟ

</a>


</div>

</header>



<div class="container">


<div class="article-box">


<img 
id="image"
class="article-image"
style="display:none;">



<span 
id="category"
class="category">

</span>



<h1 id="title">

Loading...

</h1>



<div 
id="date"
class="date">

</div>



<div 
id="description"
class="description">

</div>



<div class="share">


<button 
class="whatsapp"
onclick="shareWhatsApp()">

WhatsApp Share

</button>


<button
class="copy"
onclick="copyLink()">

Copy Link

</button>


</div>
  <div class="like-box">

<button 
id="likeButton"
class="like-btn"
onclick="likeArticle()">

❤️ Like 
<span id="likeCount">0</span>

</button>

</div>

  <div class="comment-box">

<h2>💬 ಅಭಿಪ್ರಾಯಗಳು</h2>

<input 
id="commentName"
type="text"
placeholder="ನಿಮ್ಮ ಹೆಸರು">


<textarea
id="commentText"
placeholder="ನಿಮ್ಮ ಅಭಿಪ್ರಾಯ ಬರೆಯಿರಿ"></textarea>


<button onclick="addComment()">
Comment Post ಮಾಡಿ
</button>


<div id="commentsList"></div>

</div>
<br><br>

<hr>

<h2>
ಇದೇ ರೀತಿಯ ಇತರ ಲೇಖನಗಳು
</h2>

<div id="related" class="related-grid"></div>

</div>


</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwTvaf6H0ETygmY5bRJXP_5QgLYaeIYcXAjp0JtCaMB1mCxa_TMYKPaIZ5hTUCyGoqAVg/exec";

let currentArticle = {};
let allArticles = [];


/* =========================
   LOAD ARTICLE
========================= */

async function loadArticle() {

  try {

    const id =
      new URLSearchParams(
        window.location.search
      ).get("id");


    if (id === null) {

      document.getElementById("title").innerText =
        "ಲೇಖನ ಸಿಗಲಿಲ್ಲ";

      return;

    }


    const response =
      await fetch(API_URL);


    if (!response.ok) {

      throw new Error(
        "API connection failed"
      );

    }


    const articles =
      await response.json();


    if (!Array.isArray(articles)) {

      throw new Error(
        "Invalid API response"
      );

    }


    allArticles = articles;


    currentArticle =
      articles[Number(id)];


    if (!currentArticle) {

      document.getElementById("title").innerText =
        "ಲೇಖನ ಸಿಗಲಿಲ್ಲ";

      return;

    }


    document.getElementById("title").innerText =
      currentArticle.title || "";


    document.getElementById("category").innerText =
      currentArticle.category || "";


    document.getElementById("date").innerText =
      currentArticle.date
        ? "📅 " + currentArticle.date
        : "";


    document.getElementById("description").innerText =
      currentArticle.description || "";


    if (currentArticle.image) {

      const img =
        document.getElementById("image");

      img.src =
        currentArticle.image;

      img.style.display =
        "block";

    }


    showRelatedArticles(
      articles,
      Number(id)
    );


    loadLikes(
      Number(id)
    );


    loadComments(
      Number(id)
    );

  }

  catch (error) {

    console.error(error);

    document.getElementById("title").innerText =
      "ಲೇಖನ ತೆರೆಯಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ";

    document.getElementById("description").innerText =
      error.message;

  }

}


/* =========================
   WHATSAPP SHARE
========================= */

function shareWhatsApp() {

  const url =
    window.location.href;


  const text =
    (currentArticle.title || "") +
    "\n\n" +
    url;


  window.open(
    "https://wa.me/?text=" +
    encodeURIComponent(text),
    "_blank"
  );

}


/* =========================
   COPY LINK
========================= */

function copyLink() {

  navigator.clipboard.writeText(
    window.location.href
  );


  alert(
    "ಲೇಖನ ಲಿಂಕ್ copy ಆಗಿದೆ!"
  );

}


/* =========================
   RELATED ARTICLES
========================= */

function showRelatedArticles(
  articles,
  currentId
) {

  const box =
    document.getElementById("related");


  if (!box) return;


  const related =
    articles
      .map((item, index) => ({
        item,
        index
      }))
      .filter(obj =>
        obj.index !== currentId &&
        obj.item.category ===
          currentArticle.category
      )
      .slice(0, 3);


  box.innerHTML = "";


  related.forEach(obj => {

    box.innerHTML += `

      <div
        class="related-card"
        onclick="
          location.href='article.html?id=${obj.index}'
        "
      >

        <h3>
          ${obj.item.title || ""}
        </h3>

        <span>
          ${obj.item.category || ""}
        </span>

      </div>

    `;

  });

}


/* =========================
   LOAD LIKES
========================= */

async function loadLikes(id) {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=likes&id=" +
        id
      );


    const result =
      await response.json();


    document.getElementById(
      "likeCount"
    ).innerText =
      result.likes || 0;

  }

  catch (error) {

    console.error(
      "Likes error:",
      error
    );

  }

}


/* =========================
   LIKE ARTICLE
========================= */

async function likeArticle(){

const id =
new URLSearchParams(
window.location.search
).get("id");


if(localStorage.getItem("liked_" + id)){

alert("ನೀವು ಈಗಾಗಲೇ Like ಮಾಡಿದ್ದೀರಿ ❤️");

return;

}


const form =
new URLSearchParams();


form.append(
"action",
"like"
);


form.append(
"id",
id
);


const response =
await fetch(API_URL,{

method:"POST",

body:form

});


const result =
await response.json();


if(result.success){


document.getElementById(
"likeCount"
).innerText =
result.likes;


localStorage.setItem(
"liked_" + id,
"yes"
);


}

else{

alert(
result.error || "Like failed"
);

}

}

/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(id) {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=comments&id=" +
        id
      );


    const comments =
      await response.json();


    const box =
      document.getElementById(
        "commentsList"
      );


    box.innerHTML = "";


    if (
      !Array.isArray(comments) ||
      comments.length === 0
    ) {

      box.innerHTML = `
        <p>
          ಇನ್ನೂ ಯಾವುದೇ ಅಭಿಪ್ರಾಯಗಳಿಲ್ಲ.
        </p>
      `;

      return;

    }


    comments.forEach(item => {

      box.innerHTML += `

        <div class="comment-item">

          <b>
            ${item.name || "Anonymous"}
          </b>

          <p>
            ${item.comment || ""}
          </p>

          <small>
            ${item.date || ""}
          </small>

        </div>

      `;

    });

  }

  catch (error) {

    console.error(
      "Comments error:",
      error
    );

  }

}


/* =========================
   ADD COMMENT
========================= */

async function addComment() {

  try {

    const id =
      new URLSearchParams(
        window.location.search
      ).get("id");


    const name =
      document.getElementById(
        "commentName"
      ).value.trim();


    const comment =
      document.getElementById(
        "commentText"
      ).value.trim();


    if (!comment) {

      alert(
        "ದಯವಿಟ್ಟು ನಿಮ್ಮ ಅಭಿಪ್ರಾಯ ಬರೆಯಿರಿ."
      );

      return;

    }


    const form =
      new URLSearchParams();


    form.append(
      "action",
      "comment"
    );


    form.append(
      "articleId",
      id
    );


    form.append(
      "name",
      name || "Anonymous"
    );


    form.append(
      "comment",
      comment
    );


    const response =
      await fetch(
        API_URL,
        {
          method: "POST",
          body: form
        }
      );


    const result =
      await response.json();


    if (result.success) {

      alert(
        "Comment added successfully!"
      );


      document.getElementById(
        "commentText"
      ).value = "";


      loadComments(
        Number(id)
      );

    }

    else {

      alert(
        result.error ||
        "Comment add ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ."
      );

    }

  }

  catch (error) {

    console.error(error);

    alert(
      "Comment ಮಾಡುವಾಗ error ಬಂದಿದೆ: " +
      error.message
    );

  }

}


/* =========================
   START
========================= */

loadArticle();

</script>

</body>

</html>
